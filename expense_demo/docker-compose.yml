services:
  expense-demo:
    build:
      context: .
      # pip 镜像源可作为构建参数覆盖（默认国内清华源，见 Dockerfile）。
      # 例如某源不可用时：PIP_INDEX_URL=https://pypi.org/simple docker compose up --build -d
      # 注意：代理污染已在 Dockerfile 的 pip 层用 env -u 剥离，无需在这里传代理。
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
    image: expense-demo:latest
    container_name: expense-demo
    ports:
      - "8501:8501"

    # 配置注入：把宿主机 .env 的键值作为「环境变量」注入容器（config.py 全部从 os.environ 读取）。
    # 关键点：不再用 volumes 把 .env 文件 bind mount 进容器——
    #   Docker 在源文件缺失时会自动创建同名「目录」，一旦变成目录就永远读不到配置，
    #   且此时重写 .env 会失败（往目录里写）。改用 env_file 从根源消除该陷阱。
    # required: false：.env 缺失时也能启动（应用回退到内置默认：prod + 统计可用）。
    env_file:
      - path: ./.env
        required: false

    # 只挂载数据目录（真实存在的目录，无文件挂载陷阱）；数据库重启不丢。
    volumes:
      - ./data:/app/data

    restart: unless-stopped
